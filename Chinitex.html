<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#174c5b">
    <meta name="description" content="Tus proyectos, conversaciones e ideas, en un lugar para avanzar.">
    <title>Chinitex · Tu espacio para avanzar</title>
    <style>
:root {
  color-scheme: light;
  --ink: #183440;
  --muted: #62747d;
  --primary: #174c5b;
  --primary-hover: #103b48;
  --teal: #267c7c;
  --teal-light: #e9f3f0;
  --yellow: #f6dda2;
  --yellow-light: #fff6df;
  --background: #f5f7f8;
  --surface: #ffffff;
  --line: #e1e8e9;
  --danger: #a13634;
  --radius: 18px;
  --shadow: 0 5px 18px rgba(25, 57, 66, .035);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-synthesis: none;
  color: var(--ink);
  background: var(--background);
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: wait; }
button, a { touch-action: manipulation; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid #73aeb8; outline-offset: 3px; }
button:focus:not(:focus-visible), main:focus:not(:focus-visible) { outline: none; }
a { color: #25677e; text-underline-offset: 3px; }
svg { width: 20px; height: 20px; flex: 0 0 auto; stroke-linecap: round; stroke-linejoin: round; }
h1, h2, h3, h4, p { margin-top: 0; }
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -.025em; }
h1 { font-size: clamp(1.6rem, 2.7vw, 2.1rem); font-weight: 680; margin: 4px 0 0; }
h2 { font-size: 1.35rem; font-weight: 660; }
h3 { font-size: 1.05rem; font-weight: 650; }
p { line-height: 1.65; }
button { color: inherit; }
[hidden] { display: none !important; }
.screen-reader-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; z-index: 100; top: 10px; left: 10px; transform: translateY(-150%); background: var(--primary); color: #fff; border-radius: 8px; padding: 12px 18px; }
.skip-link:focus { transform: translateY(0); }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 238px minmax(0, 1fr); }
.sidebar { background: #fff; border-right: 1px solid var(--line); padding: 31px 20px 23px; display: flex; flex-direction: column; gap: 33px; position: sticky; top: 0; height: 100vh; min-height: 600px; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 7px; }
.brand-mark { display: grid; place-items: center; position: relative; width: 42px; height: 44px; border-radius: 13px; background: var(--primary); color: #fff; font-size: 38px; font-weight: 750; line-height: 1; padding-bottom: 7px; }
.brand-mark span { position: absolute; right: 6px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); }
.brand strong { display: block; font-size: 1.4rem; font-weight: 730; letter-spacing: -.045em; }
.brand div > span { display: block; color: var(--muted); font-size: .68rem; margin-top: 1px; }
.main-nav { display: grid; gap: 6px; }
.nav-button { border: 0; border-radius: 11px; padding: 13px 15px; display: flex; align-items: center; gap: 13px; color: #647780; background: transparent; text-align: left; font-size: .94rem; font-weight: 570; transition: background .15s, color .15s; }
.nav-button:hover { color: var(--primary); background: #f3f7f7; }
.nav-button.is-active, .nav-button.active, .nav-button[aria-current="page"] { color: var(--primary); background: #eaf2f3; font-weight: 680; }
.nav-button.is-active svg, .nav-button.active svg, .nav-button[aria-current="page"] svg { stroke-width: 2; }
.sidebar-note { background: #f8f6ee; border-radius: 14px; padding: 18px 16px; margin: auto 3px 0; }
.note-symbol { color: #a37b28; font-size: 23px; }
.sidebar-note p { font-size: .88rem; line-height: 1.5; margin: 9px 0 6px; font-weight: 600; }
.sidebar-note > span:last-child { color: #857c69; font-size: .75rem; line-height: 1.6; display: block; }
.sidebar-footer { padding: 0 8px; display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: .72rem; line-height: 1.6; }
.status-dot { flex-shrink: 0; width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; background: #6b9b83; }
.workspace { width: 100%; max-width: 1600px; padding: 34px 42px 64px; min-width: 0; }
.workspace-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 25px 22px; margin-bottom: 28px; }
.eyebrow { display: block; color: #7c8b91; font-size: .64rem; font-weight: 720; letter-spacing: .12em; }
.header-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 9px; }
.header-actions .button { font-size: .78rem; padding: 10px 12px; }
.header-actions svg { width: 16px; height: 16px; }
.search-box { display: flex; align-items: center; gap: 10px; width: 100%; grid-column: 1 / -1; background: #fff; border: 1px solid var(--line); border-radius: 12px; color: #7e9198; padding: 0 16px; min-height: 49px; transition: border-color .15s, box-shadow .15s; }
.search-box:focus-within { border-color: #6d9fab; box-shadow: 0 0 0 3px #dcebf0; }
.search-box input { min-width: 0; width: 100%; background: transparent; border: none; padding: 13px 0; outline: 0 !important; color: var(--ink); font-size: .9rem; }
.search-box input::placeholder { color: #8a989d; }
#view { min-height: 55vh; }

.button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 15px; border: 1px solid transparent; border-radius: 9px; font-size: .85rem; line-height: 1.35; font-weight: 620; text-decoration: none; background: #edf2f3; color: var(--primary); transition: background .15s, border-color .15s, transform .15s; }
.button:hover { background: #e2ebed; }
.button:active { transform: translateY(1px); }
.button.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
.button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.button.secondary { color: var(--ink); background: #fff; border-color: #d7e0e3; }
.button.secondary:hover { border-color: #9bb5bc; background: #f9fbfb; }
.button.ghost { color: var(--muted); background: transparent; }
.button.ghost:hover { color: var(--primary); background: #edf2f3; }
.button.small { padding: 7px 10px; font-size: .75rem; border-radius: 7px; }
.button.icon { padding: 8px; min-width: 34px; min-height: 34px; }
.button.danger { background: #fff0ee; color: var(--danger); }
.button.danger:hover { background: #ffe2de; }
.button[aria-pressed="true"] { border-color: #4b8c8c; background: #e2f0ec; color: #205c58; }
.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 23px; background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
.card h2:last-child, .card h3:last-child, .card p:last-child { margin-bottom: 0; }
.card + .card { margin-top: 16px; }
.grid > .card + .card, .stats-grid > .card + .card, .split > .card + .card { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr)); gap: 16px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(260px, 1fr); gap: 22px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack > .card + .card { margin-top: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 30px 0 15px; }
.section-heading:first-child { margin-top: 0; }
.section-heading h2, .section-heading h3, .section-heading p { margin-bottom: 0; }
.section-heading p { font-size: .85rem; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.eyebrow + h2 { margin-top: 8px; }
.hero { background: linear-gradient(112deg, #e6f0f0, #edf3ef); border: 1px solid #d7e5e1; border-radius: 20px; padding: 30px; position: relative; overflow: hidden; }
.hero h2 { font-size: clamp(1.55rem, 2.5vw, 2rem); line-height: 1.22; max-width: 650px; margin-bottom: 12px; }
.hero p { max-width: 690px; color: #526e76; font-size: .93rem; margin-bottom: 20px; }
.hero .eyebrow { color: #537e80; margin-bottom: 9px; }
.hero .button { margin-right: 6px; margin-top: 4px; }
.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin: 20px 0 28px; }
.stat { padding: 18px 20px; border: 1px solid var(--line); background: #fff; border-radius: 13px; min-width: 0; }
.stat strong, .stat .value { display: block; color: var(--primary); font-size: 1.8rem; letter-spacing: -.045em; font-weight: 700; line-height: 1.2; margin: 5px 0 7px; }
.stat span, .stat .label { font-size: .78rem; color: var(--muted); }
.stat p { font-size: .72rem; margin: 4px 0 0; color: #839297; }
.pill, .badge, .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; color: #46676f; background: #edf3f3; border-radius: 6px; font-size: .69rem; font-weight: 600; line-height: 1.45; white-space: normal; }
.pill.yellow, .badge.warning, .chip.warning { background: var(--yellow-light); color: #896322; }
.pill.green, .badge.success { color: #336b52; background: #eaf4eb; }
.pill.blue, .badge.info { color: #3b627c; background: #eaf1f8; }
.badge[data-area="cas"] { color: #77548a; background: #f3ecf8; }
.badge[data-area="familia"] { color: #946f31; background: #fcf3df; }
.badge[data-area="ocio"] { color: #416f60; background: #e9f3eb; }
.count { min-width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; color: #6b7e85; background: #edf1f3; border-radius: 6px; font-size: .72rem; font-weight: 600; }
.toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin: 0 0 18px; }
.toolbar p { margin: 0; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
.filters label { display: inline-flex; align-items: center; gap: 7px; font-size: .82rem; color: var(--muted); }
.filters select { min-height: 37px; padding: 7px 29px 7px 11px; border-radius: 8px; background-color: #fff; border: 1px solid #d9e3e5; color: #46616c; font-size: .8rem; }
.filters input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.tabs button { border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 8px 12px; font-weight: 600; font-size: .8rem; color: var(--muted); }
.tabs button.active, .tabs button[aria-selected="true"] { border-color: #d7e7e5; background: #eaf3f0; color: #2a6a64; }
.list { display: grid; gap: 12px; }
.conversation-card { padding: 18px 20px; background: #fff; border: 1px solid var(--line); border-radius: 12px; transition: border-color .15s, box-shadow .15s; min-width: 0; }
.conversation-card:hover { border-color: #b6cdd0; box-shadow: var(--shadow); }
.conversation-card h3 { margin: 0 0 6px; font-size: 1rem; }
.conversation-card p { margin: 10px 0 12px; font-size: .83rem; color: #667c85; line-height: 1.6; overflow-wrap: anywhere; }
.conversation-card .row { gap: 7px; }
.conversation-card .source-label { margin-top: 7px; }
.source-label { display: block; color: #8a999e; font-size: .7rem; overflow-wrap: anywhere; }
.conversation-title { background: transparent; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; font-weight: inherit; }
.conversation-title:hover { color: var(--teal); }
.conversation-actions { display: flex; gap: 7px; flex-wrap: wrap; }
.empty-state { text-align: center; color: var(--muted); padding: 42px 24px; background: #fff; border: 1px dashed #cddadc; border-radius: 15px; }
.empty-state h2, .empty-state h3 { color: var(--ink); margin-bottom: 8px; }
.empty-state p { max-width: 470px; margin: 0 auto 18px; font-size: .88rem; }
.empty-state .button { margin: 4px; }
.suggestion-card { padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: #fff; min-width: 0; }
.suggestion-card .pill { margin-bottom: 10px; }
.suggestion-card h3 { font-size: .98rem; margin-bottom: 7px; }
.suggestion-card p { font-size: .82rem; color: var(--muted); margin-bottom: 16px; }
.suggestion-card .button { font-size: .75rem; }
.task-card { border: 1px solid #dce5e6; background: #fff; border-radius: 11px; padding: 15px; box-shadow: 0 2px 6px #18344003; }
.task-card h3 { font-size: .9rem; line-height: 1.45; margin-bottom: 8px; overflow-wrap: anywhere; }
.task-card p { font-size: .78rem; color: var(--muted); margin-bottom: 12px; overflow-wrap: anywhere; }
.task-card .button { font-size: .7rem; }
.task-card .row { gap: 6px; }
.task-card select { max-width: 100%; border: 1px solid #dce5e6; background: #f9fbfb; border-radius: 6px; padding: 5px 7px; color: #56717c; font-size: .73rem; }
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 17px; align-items: start; }
.kanban-column { padding: 15px; border: 1px solid #e2e8e9; background: #eef2f3; border-radius: 14px; min-height: 200px; }
.kanban-column > h2, .kanban-column > h3 { font-size: .85rem; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 3px 2px 15px; color: #506a74; }
.kanban-column > .task-card + .task-card { margin-top: 10px; }
.kanban-column .empty-state { border: none; padding: 25px 8px; background: transparent; font-size: .8rem; }
.project-card { position: relative; }
.project-card h3 { margin: 10px 0 8px; }
.project-card dl { display: grid; grid-template-columns: 100px 1fr; gap: 6px 12px; font-size: .8rem; margin: 15px 0; }
.project-card dt { color: #8a999e; }
.project-card dd { margin: 0; color: #536c76; overflow-wrap: anywhere; }
.timeline { display: grid; gap: 12px; margin: 15px 0; padding-left: 15px; border-left: 2px solid #d9e7e6; }
.timeline > div { position: relative; padding-left: 5px; }
.timeline > div::before { content: ""; position: absolute; width: 7px; height: 7px; top: 8px; left: -20px; border-radius: 50%; background: #6b9f9c; box-shadow: 0 0 0 3px #fff; }
.timeline p { margin: 3px 0; font-size: .82rem; }
.area-label { font-size: .7rem; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: #789096; }
.notice { padding: 14px 17px; border-radius: 10px; background: var(--yellow-light); color: #7d693e; font-size: .8rem; line-height: 1.6; margin: 16px 0; }
.notice p:last-child { margin-bottom: 0; }
.pagination { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin: 20px 0; font-size: .8rem; color: var(--muted); }
mark { color: #5b4b1e; background: #f7e7ad; border-radius: 2px; padding: 0 2px; }

dialog { color: var(--ink); border: 1px solid #d7e2e5; border-radius: 19px; padding: 0; width: min(700px, calc(100vw - 36px)); max-height: 88vh; max-height: 88dvh; box-shadow: 0 25px 90px #102d3a38; background: #fff; overflow: auto; }
dialog::backdrop { background: #18344065; backdrop-filter: blur(3px); }
dialog > form, dialog > .modal-body, dialog > .reader-content { padding: 27px; }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 22px; }
.modal-header h2 { font-size: 1.3rem; margin: 1px 0 6px; }
.modal-header p { margin: 0; color: var(--muted); font-size: .83rem; }
.modal-header .button { flex-shrink: 0; }
.modal-actions { display: flex; justify-content: flex-end; gap: 9px; flex-wrap: wrap; margin-top: 23px; padding-top: 18px; border-top: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 15px; min-width: 0; }
.field > span, .field > label, label.field { font-weight: 600; font-size: .82rem; }
.field small { color: var(--muted); font-weight: 400; font-size: .73rem; }
.field input, .field select, .field textarea { width: 100%; color: var(--ink); background: #fff; border: 1px solid #cfdbde; border-radius: 8px; padding: 10px 11px; font-weight: 400; font-size: .88rem; min-height: 42px; }
.field input::placeholder, .field textarea::placeholder { color: #95a3a8; }
.field textarea { min-height: 92px; resize: vertical; line-height: 1.6; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.form-grid .full { grid-column: 1 / -1; }
.reader-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .74rem; color: var(--muted); margin: 0 0 20px; }
.message { padding: 16px 18px; background: #f4f7f7; border: 1px solid #e4ebeb; border-radius: 10px; margin: 11px 0; overflow-wrap: anywhere; }
.message time, .message .source-label { display: block; margin-bottom: 8px; font-size: .7rem; color: #84979d; }
.message p, .message pre, .message .text { white-space: pre-wrap; font-family: inherit; font-size: .86rem; color: #3a5660; line-height: 1.7; margin: 0; overflow-wrap: anywhere; }
.reader-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
.reader-title { padding-right: 20px; }
.toast { position: fixed; z-index: 30; bottom: 25px; left: calc(50% + 119px); transform: translate(-50%, 12px); background: #183f4d; color: #fff; padding: 13px 20px; border: 1px solid #41616b; border-radius: 11px; box-shadow: 0 8px 24px #1834402b; max-width: min(520px, calc(100vw - 40px)); font-size: .85rem; line-height: 1.5; }
.toast:not([hidden]) { animation: toast-enter .18s ease-out both; }
@keyframes toast-enter { to { transform: translate(-50%, 0); opacity: 1; } from { transform: translate(-50%, 8px); opacity: 0; } }

@media (min-width: 1500px) { .workspace { padding-left: 54px; padding-right: 54px; } }
@media (max-width: 1200px) {
  .app-shell { grid-template-columns: 210px minmax(0,1fr); }
  .sidebar { padding: 28px 14px 22px; }
  .brand { gap: 9px; padding: 0 5px; }
  .brand strong { font-size: 1.3rem; }
  .brand div > span { font-size: .62rem; }
  .workspace { padding: 29px 28px 48px; }
  .workspace-header { gap: 20px 16px; }
  .header-actions { gap: 5px; }
  .header-actions .button { font-size: .74rem; padding: 9px; }
  .header-actions .button svg { display: none; }
  .split { grid-template-columns: minmax(0, 1.2fr) minmax(240px, 1fr); gap: 16px; }
  .toast { left: calc(50% + 105px); }
}

@media (max-width: 980px) {
  .workspace-header { grid-template-columns: 1fr; }
  .header-actions { justify-content: flex-start; grid-row: 3; }
  .search-box { grid-row: 2; }
  .header-actions .button { padding: 9px 12px; font-size: .78rem; }
  .header-actions .button svg { display: block; }
  .split, .grid.three { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .kanban { gap: 10px; }
  .kanban-column { padding: 11px; }
}

@media (max-width: 760px) {
  .app-shell { display: block; }
  .sidebar { height: auto; min-height: 0; padding: 16px 18px 0; position: static; border-right: 0; border-bottom: 1px solid var(--line); gap: 14px; }
  .brand { padding: 0 2px; gap: 9px; }
  .brand-mark { width: 35px; height: 36px; border-radius: 10px; font-size: 32px; padding-bottom: 6px; }
  .brand-mark span { width: 6px; height: 6px; top: 7px; right: 5px; }
  .brand strong { font-size: 1.25rem; }
  .brand div > span { font-size: .65rem; }
  .main-nav { grid-template-columns: repeat(4,minmax(0,1fr)); gap: 4px; }
  .nav-button { flex-direction: column; justify-content: center; text-align: center; gap: 5px; padding: 10px 5px 11px; font-size: .7rem; border-radius: 9px 9px 0 0; }
  .nav-button svg { width: 19px; height: 19px; }
  .sidebar-note, .sidebar-footer { display: none; }
  .workspace { padding: 24px 18px 40px; }
  .workspace-header { gap: 16px; margin-bottom: 23px; }
  .eyebrow { font-size: .6rem; }
  .header-actions { gap: 7px; }
  .header-actions .button { flex: 1 1 auto; padding: 10px 9px; font-size: .72rem; gap: 5px; }
  .header-actions .button svg { width: 14px; height: 14px; }
  .search-box { min-height: 46px; padding: 0 12px; }
  .search-box input { font-size: .85rem; padding: 12px 0; }
  .hero { padding: 24px 21px; border-radius: 16px; }
  .hero p { font-size: .87rem; }
  .card { padding: 20px; border-radius: 14px; }
  .section-heading { margin-top: 25px; }
  .section-heading h2 { font-size: 1.2rem; }
  .stats-grid { gap: 10px; margin: 16px 0 24px; }
  .stat { padding: 14px 15px; border-radius: 11px; }
  .stat strong, .stat .value { font-size: 1.65rem; }
  .stat span, .stat .label { font-size: .73rem; }
  .grid.two, .grid.three, .kanban { grid-template-columns: 1fr; }
  .kanban-column { padding: 14px; min-height: 120px; }
  .toolbar { align-items: flex-start; }
  .filters { gap: 8px; width: 100%; }
  .filters select { max-width: 100%; }
  .conversation-card { padding: 16px; }

      workspace.projects = existing ? workspace.projects.map(p => p.id === existing.id ? next : p) : [...workspace.projects, next];
      persist(); modal.dialog.close(); navigate('projects'); toast('Ficha de proyecto guardada.');
    });
    form.elements.name.addEventListener('input', () => form.elements.name.setCustomValidity(''));
    modal.body.append(form); modal.show(); form.elements.name.focus();
  }
  function downloadFile(name, data, type) {
    const url = URL.createObjectURL(new Blob([data], { type }));
    const link = h('a', { href: url, download: name });
    document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }
  function exportProject(project) {
    const fields = [['CUI', project.cui], ['Función o designación', project.role], ['Última versión', project.version], ['Estado', PROJECT_STATUS[project.status]], ['Siguiente acción', project.nextAction], ['Fuente', project.source], ['Notas y datos por comprobar', project.notes]];
    const content = `# ${project.name}\n\n${fields.map(([key, value]) => `**${key}:** ${value || 'Por confirmar'}`).join('\n\n')}\n\nGenerado en Chinitex. Los campos reflejan lo registrado por su usuario.\n`;
    const safeName = project.name.replace(/[^\p{L}\p{N} -]/gu, '').trim().slice(0, 60) || 'proyecto';
    downloadFile(`Ficha-${safeName}.md`, content, 'text/markdown;charset=utf-8'); toast('Ficha descargada.');
  }
  function renderProjects() {
    view.append(h('div', { class: 'section-heading' }, h('div', {}, h('h2', {}, 'Cada proyecto con su fuente'), h('p', { class: 'muted' }, 'Las fichas las completas tú. Una referencia del historial puede servir de antecedente o de modelo.')), button('Nueva ficha', () => openProjectEditor(), 'button primary')));
    if (!workspace.projects.length) { view.append(empty('Tu primer proyecto empieza aquí', 'Registra la fuente, la versión actual y una siguiente acción. También puedes crear una ficha desde una conversación.', button('Crear ficha de proyecto', () => openProjectEditor(), 'button primary'))); return; }
    const cards = workspace.projects.map(project => h('article', { class: 'project-card card' }, h('span', { class: 'pill' }, PROJECT_STATUS[project.status]), h('h3', {}, project.name),
      h('dl', { class: 'project-facts' }, h('dt', {}, 'CUI'), h('dd', {}, project.cui || 'No registrado'), h('dt', {}, 'Función'), h('dd', {}, project.role || 'Por confirmar'), h('dt', {}, 'Versión'), h('dd', {}, project.version || 'Por confirmar')),
      h('div', { class: 'project-next' }, h('span', { class: 'source-label' }, 'SIGUIENTE ACCIÓN'), h('p', {}, project.nextAction || 'Por definir')),
      h('p', { class: 'source-label source-text' }, `Fuente: ${project.source || 'Por registrar'}`),
      h('div', { class: 'row' }, button('Editar ficha', () => openProjectEditor(project), 'button secondary small'), button('Descargar ficha', () => exportProject(project), 'button ghost small'))));
    view.append(h('div', { class: 'project-grid' }, cards));
  }
  function render() {
    view.replaceChildren();
    if (currentView === 'home') renderHome();
    else if (currentView === 'library') renderLibrary();
    else if (currentView === 'projects') renderProjects();
    else renderWeek();
  }
  async function importFiles(files) {
    if (!files.length) return;
    const trigger = document.getElementById('import-trigger'); trigger.disabled = true; trigger.textContent = 'Leyendo archivos…';
    try {
      const imported = []; const backups = []; let ignored = 0;
      for (const file of files) {
        let data;
        try { data = JSON.parse(await file.text()); } catch { throw new Error(`No pude leer ${file.name} como JSON válido. No se cambió tu biblioteca.`); }
        if (data?.format === 'chinitex-backup') { backups.push(Core.parseBackup(data)); continue; }
        const normalized = Core.extractConversations(data, file.name);
        if (normalized.length) imported.push(...normalized); else ignored++;
      }
      if (backups.length) {
        if (backups.length !== 1 || imported.length || files.length !== 1) throw new Error('Para restaurar una copia, selecciona solo ese archivo.');
        if (!confirm('¿Restaurar esta copia? Reemplazará la biblioteca, las tareas y las fichas actuales.')) return;
        archive = backups[0].archive; workspace = backups[0].state; persist(); filters = { ...filters, query: '', area: 'all', modelsOnly: false, bookmarkedOnly: false }; searchInput.value = ''; navigate('home'); toast('Copia restaurada. Tu historial y tus cambios están disponibles.');
      } else {
        if (!imported.length) throw new Error('No encontré conversaciones en esos archivos. Selecciona los JSON conversations de tu exportación.');
        const before = archive.length; archive = Core.mergeConversations(archive, imported); visibleResults = 24; navigate('library');
        toast(`${archive.length} conversaciones disponibles · ${archive.length - before} nuevas${ignored ? ` · ${ignored} archivos auxiliares omitidos` : ''}. Guarda una copia para conservar la importación.`);
      }
    } catch (error) { toast(error.message || 'No pude importar los archivos. Tu biblioteca sigue igual.'); }
    finally { trigger.disabled = false; trigger.textContent = 'Importar'; importInput.value = ''; }
  }
  for (const nav of document.querySelectorAll('[data-view]')) nav.addEventListener('click', () => navigate(nav.dataset.view));
  document.getElementById('import-trigger').addEventListener('click', () => importInput.click());
  importInput.addEventListener('change', () => importFiles([...importInput.files]));
  document.getElementById('export-backup').addEventListener('click', () => {
    const backup = Core.makeBackup(archive, workspace);
    downloadFile(`Chinitex-copia-${today()}.json`, JSON.stringify(backup), 'application/json;charset=utf-8'); toast('Copia descargada con tu historial, tareas, fichas y referencias.');
  });
  document.getElementById('quick-task').addEventListener('click', () => openTaskEditor());
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { filters.query = searchInput.value; visibleResults = 24; navigate('library'); }, 140);
  });
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); filters.query = searchInput.value; visibleResults = 24; navigate('library'); } });
  navigate('home');
})();

</script>
